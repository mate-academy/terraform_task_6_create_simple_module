name: Terraform Module Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.4
      
      - name: Check Module Exists
        run: |
          if [ ! -d "modules/resource_group_storage" ]; then
            echo "❌ Module directory not found!"
            exit 1
          fi
          echo "✅ Module directory exists"
      
      - name: Check Module Files
        run: |
          if [ ! -f "modules/resource_group_storage/main.tf" ]; then
            echo "❌ main.tf not found!"
            exit 1
          fi
          if [ ! -f "modules/resource_group_storage/variables.tf" ]; then
            echo "❌ variables.tf not found!"
            exit 1
          fi
          if [ ! -f "modules/resource_group_storage/outputs.tf" ]; then
            echo "❌ outputs.tf not found!"
            exit 1
          fi
          echo "✅ All module files exist"
      
      - name: Check Module Usage in main.tf
        run: |
          if grep -q 'module "resource_group_storage"' main.tf; then
            echo "✅ Module resource_group_storage found in main.tf"
          else
            echo "❌ Module resource_group_storage not found in main.tf"
            exit 1
          fi